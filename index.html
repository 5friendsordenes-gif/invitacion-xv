<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis XV Años - Linda Patricia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        :root {
            --gold: #c49f68;
            --gold-deep: #ab8247;
            --rose-title: #96555e;
            --rose-date: #993e51;
            --text-dark: #3e2e30;
            --heart-peach: #d8967a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px 14px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'EB Garamond', serif;
            color: var(--text-dark);
            overflow-x: hidden;
            background-color: #f9f3f7;
            position: relative;
        }

        /* Fondo exterior perlado tornasol animado */
        .pearl-bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            overflow: hidden;
            background: linear-gradient(125deg, #fceef5 0%, #e8f3fc 25%, #f3e9fb 50%, #fdf2e9 75%, #e6f6f5 100%);
            background-size: 240% 240%;
            animation: pearlGradient 16s ease-in-out infinite alternate;
        }

        .pearl-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(65px);
            opacity: 0.78;
            pointer-events: none;
        }

        .orb-1 {
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, rgba(255, 202, 226, 0.9), transparent 70%);
            top: -80px;
            left: -80px;
            animation: floatOrb1 14s ease-in-out infinite alternate;
        }

        .orb-2 {
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(190, 225, 255, 0.9), transparent 70%);
            top: 20%;
            right: -120px;
            animation: floatOrb2 18s ease-in-out infinite alternate;
        }

        .orb-3 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(224, 198, 255, 0.88), transparent 70%);
            bottom: -100px;
            left: 10%;
            animation: floatOrb3 16s ease-in-out infinite alternate;
        }

        .orb-4 {
            width: 340px;
            height: 340px;
            background: radial-gradient(circle, rgba(255, 222, 194, 0.88), transparent 70%);
            bottom: 18%;
            right: 5%;
            animation: floatOrb1 20s ease-in-out infinite alternate-reverse;
        }
